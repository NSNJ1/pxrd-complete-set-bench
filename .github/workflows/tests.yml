name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e .
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: .venv/bin/python scripts/audit_public_tree.py
      - run: .venv/bin/pxrd-complete-set-bench evaluate data/query_phase_scores.csv --bootstrap-repeats 20 --output-json "${RUNNER_TEMP}/smoke.json"
