name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_public_tree.py
      - run: pxrd-complete-set-bench evaluate data/query_phase_scores.csv --bootstrap-repeats 20 --output-json "${RUNNER_TEMP}/smoke.json"
